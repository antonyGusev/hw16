[project]
name = 'embedded-tests'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = [
  'pytest>=8.2',
  'pytest-asyncio',
  'pyserial>=3.5',
  'poethepoet>=0.29',
  'bleak',
  'packaging',
  'python-dotenv',
  'requests',
  'opencv-python',
  'numpy',
  'ruff',
  'esptool',
]

[tool.setuptools.packages.find]
where = ['.']
include = [
  'framework*',
  'lib*',
]
exclude = [
  'tests*',
]

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
pythonpath = ['.']
addopts = '-v --tb=short'
markers = [
  'smoke: critical readiness checks',
  'regression: regression test suite',
  'positive: positive test cases',
  'negative: negative test cases',
  'first: tests that must run before other non-smoke tests',
  'min_fw(version): minimum firmware version required',
]

[tool.poe.tasks]
smoke = 'pytest -m smoke'
regression = 'pytest -m regression'
all = 'pytest'

ota = 'pytest tests/ota'
lamp = 'pytest tests/lamp'
wifi = 'pytest tests/wifi'

lint = 'ruff check .'
format = 'ruff format .'
init = 'pip install -e .'

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'auto'
